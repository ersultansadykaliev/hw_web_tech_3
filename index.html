<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на заселение в общежитие</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Заявка на общежитие</h3>
                        <form id="applicationForm">
                            <div class="mb-3">
                                <label for="studentId" class="form-label">ID студента</label>
                                <input type="number" class="form-control" id="studentId" required min="1">
                            </div>
                            <div class="mb-3">
                                <label for="buildingId" class="form-label">Номер корпуса</label>
                                <input type="number" class="form-control" id="buildingId" required min="1">
                            </div>
                            <div class="mb-3">
                                <label for="roomId" class="form-label">Номер комнаты</label>
                                <input type="number" class="form-control" id="roomId" required min="1">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Проверить заявку</button>
                        </form>

                        <div id="resultContainer" class="mt-4 d-none">
                            <!-- Result will be shown here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
